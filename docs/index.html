<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoDrop Event Gallery System by KPDev.</title>
<meta name="description" content="ดาวน์โหลดภาพถ่ายกิจกรรมความคมชัดสูง ผ่านการสแกน QR Code">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ff7a1a'/%3E%3Cpath d='M12 5v10M8 11l4 4 4-4M7 19h10' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#8b93a7;font:15px sans-serif}
  .sp{width:36px;height:36px;border:4px solid #262c39;border-top-color:#ff7a1a;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld"><div class="sp"></div>กำลังโหลด PhotoDrop...</div>
<iframe id="app" title="PhotoDrop" allow="clipboard-write; fullscreen; autoplay" allowfullscreen></iframe>
<script>
  const EXEC = 'https://script.google.com/macros/s/AKfycbzVJe5tUkrzt87CfYZ-9_AG5SAEuUX5ooi_txEePp5pcDi-2QySY30QiwZgafQmi8UO/exec';
  const f = document.getElementById('app');
  f.onload = () => document.getElementById('ld').remove();
  f.src = EXEC + location.search;
</script>
</body>
</html>
